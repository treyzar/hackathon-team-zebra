repos:
  - repo: local
    hooks:
      # Local hooks use the ruff version pinned in backend/uv.lock.
      # Run from backend/ so `src` and `extend-exclude` in pyproject.toml resolve
      # correctly; the whole project is checked (it is small and fast).
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix --exit-non-zero-on-fix .
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/
