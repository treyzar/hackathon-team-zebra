# All secrets and settings come from .env (see .env.example).
# Only values tied to this compose network (service hostnames) live here.

x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/app

x-app-env: &app-env
  DB_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  S3_ENDPOINT: http://s3:9000
  UV_NO_SYNC: "1"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    <<: *app
    command: uv run --no-sync alembic upgrade head
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  dev:
    <<: *app
    command: >
      uv run --no-sync fastapi dev --host 0.0.0.0 --port 8000 src/server.py
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

  # Runs programming tests through Judge0 on the server (JUDGE0_URL in .env).
  worker:
    <<: *app
    command: uv run --no-sync python src/worker.py
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # S3-compatible storage (SeaweedFS). Any S3 service works, the app uses boto3.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "app",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the bucket and allows browser uploads (CORS) to presigned URLs.
  s3-init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://s3:9000"
        until $$s3 s3api list-buckets > /dev/null 2>&1; do sleep 1; done
        $$s3 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null || $$s3 s3 mb "s3://$${S3_BUCKET}"
        cors=$$(printf '{"CORSRules": [{"AllowedOrigins": ["%s"], "AllowedMethods": ["GET", "PUT", "HEAD"], "AllowedHeaders": ["*"], "MaxAgeSeconds": 3600}]}' "$${S3_CORS_ORIGIN}")
        $$s3 s3api put-bucket-cors --bucket "$${S3_BUCKET}" --cors-configuration "$$cors"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:?set in .env}
      S3_CORS_ORIGIN: "*"
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      dev:
        condition: service_started

volumes:
  pgdata:
  s3data:
