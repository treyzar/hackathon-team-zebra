services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mda}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mda} -d ${POSTGRES_DB:-app}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    command: uv run --no-sync alembic upgrade head
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mda}:${POSTGRES_PASSWORD:-mda}@db:5432/${POSTGRES_DB:-app}
      UV_NO_SYNC: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  dev:
    build: .
    command: >
      uv run --no-sync fastapi dev --host 0.0.0.0 --port 8000 src/server.py
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mda}:${POSTGRES_PASSWORD:-mda}@db:5432/${POSTGRES_DB:-app}
      JWT_KEY: ${JWT_KEY:-sasha-pomenai-menya-ili-ne-menyi-voobshem-pofigu}
      JWT_ALGORITHM: HS256 # ┐(´•_•`)┌
      ACCESS_TOKEN_EXPIRE_MINUTES: 10
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
      UV_NO_SYNC: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      dev:
        condition: service_started

volumes:
  pgdata:
