[project]
name = "mda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
]

[tool.ruff]
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by the formatter
extend-per-file-ignores = { "*" = ["B008"], "alembic/env.py" = ["I001"] }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]
