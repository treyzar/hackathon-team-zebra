services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mda}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mda} -d ${POSTGRES_DB:-app}"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    command: uv run --no-sync alembic upgrade head
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mda}:${POSTGRES_PASSWORD:-mda}@db:5432/${POSTGRES_DB:-app}
      UV_NO_SYNC: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  #run:

volumes:
  pgdata: